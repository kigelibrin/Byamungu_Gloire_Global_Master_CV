
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalMasterCV — Byamungu Gloire</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      padding: 24px;
    }

    .card {
      width: min(650px, 100%);
      text-align: center;
      padding: 50px 30px;
      border: 1px solid #263044;
      border-radius: 24px;
      background: #111827;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin-bottom: 10px;
    }

    .title {
      color: #60a5fa;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    p {
      color: #aeb8ca;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    a.secondary {
      background: transparent;
      border: 1px solid #39455c;
    }

    a:hover {
      opacity: .85;
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>Byamungu Gloire</h1>

    <div class="title">
      Software Developer & Data Professional
    </div>

    <p>
      Welcome to my GlobalMasterCV — a concise overview of my
      professional journey, skills, projects, and experience.
    </p>

    <div class="buttons">
      <a href="globalmastercv.pdf" target="_blank">
        View CV
      </a>

      <a href="globalmastercv.pdf" download class="secondary">
        Download CV
      </a>
    </div>
  </main>

</body>
</html>
